---
# role: samba_ad_sysvol
# file: molecule/default/molecule.yml

dependency:
  name: "galaxy"
  options:
    requirements-file: "${MOLECULE_PROJECT_DIRECTORY}/collections.yml"
    role-file: "${SAMBA_AD_SYSVOL_ROLE_REQUIREMENTS:-molecule/resources/requirements.yml}"
driver:
  name: "podman"
provisioner:
  name: "ansible"
  config_options:
    defaults:
      forks: 8
      interpreter_python: "auto_silent"
      allow_world_readable_tmpfiles: true
      callbacks_enabled: "ansible.builtin.default"
      callback_result_format: "yaml"
      remote_tmp: "/tmp/.ansible/tmp"
    ssh_connection:
      pipelining: true
  log: true
  playbooks:
    prepare: "../resources/playbooks/prepare.yml"
    converge: "../resources/playbooks/converge.yml"
    verify: "../resources/playbooks/verify.yml"
    side_effect: "../resources/playbooks/side_effect.yml"
  inventory:
    group_vars:
      all:
        __samba_ad_sysvol_test_rootless: true
        samba_ad_dc_realm: "AD.EXAMPLE.TEST"
        samba_ad_dc_domain: "EXAMPLE"
        samba_ad_dc_hostname: "dc1"
        samba_ad_dc_admin_password: "Molecule-Only-Adm1n!"
        samba_ad_dc_rpc_dynamic_port_range: "50000-55000"
      samba_ad_sysvol_joiners:
        samba_ad_dc_mode: "join"
        samba_ad_dc_hostname: "dc2"
        samba_ad_dc_join_server: "dc1.ad.example.test"
        __samba_ad_sysvol_test_source: "{{ inventory_hostname.removesuffix('-join') }}"
        samba_ad_sysvol_source: "{{ __samba_ad_sysvol_test_source }}"
  connection_options:
    ansible_user: "molecule"
verifier:
  name: "ansible"
scenario:
  test_sequence:
    - "dependency"
    - "destroy"
    - "syntax"
    - "create"
    - "prepare"
    - "converge"
    - "idempotence"
    - "check"
    - "verify"
    - "side_effect"
    - "destroy"
  name: "default"
platforms:
  - name: "samba-ad-sysvol-${img:-fedora}"
    hostname: "dc1"
    image: "docker.io/${uns:-jomrr}/molecule-${img:-fedora}:${tag:-latest}"
    groups:
      - "samba_ad_sysvol_sources"
    network: "samba-ad-sysvol-${MOLECULE_SCENARIO_NAME}"
    pre_build_image: true
    override_command: false
    systemd: "true"
    privileged: true
    extra_opts:
      - "--tmpfs=/var/lib/samba:rw,size=1g,mode=0755"
  - name: "samba-ad-sysvol-${img:-fedora}-join"
    hostname: "dc2"
    image: "docker.io/${uns:-jomrr}/molecule-${img:-fedora}:${tag:-latest}"
    groups:
      - "samba_ad_sysvol_joiners"
    network: "samba-ad-sysvol-${MOLECULE_SCENARIO_NAME}"
    pre_build_image: true
    override_command: false
    systemd: "true"
    privileged: true
    extra_opts:
      - "--tmpfs=/var/lib/samba:rw,size=1g,mode=0755"
